<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowVeo Control Panel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-area">
        <img src="../icons/logo.png" alt="FlowDeck" class="logo-img">
        <div class="title-group">
          <h1>FlowDeck</h1>
          <span class="version">AI Video & Profile Manager</span>
        </div>
      </div>
      <div class="sync-status" id="syncStatus">
        <span class="status-dot"></span>
        <span id="syncText">Syncing...</span>
      </div>
    </header>

    <div class="card active-server-card">
      <div class="card-header">
        <span class="card-label">Active Backend Node</span>
        <span class="badge" id="serverStatusBadge">Active</span>
      </div>
      <div class="server-title" id="activeServerName">Server 1 (Primary Pool A)</div>
      <div class="server-warning">
        ⚠️ Projects are stored per-server. Do not switch during rendering.
      </div>
    </div>

    <div class="card credits-card">
      <div class="card-header">
        <span class="card-label">Virtual Credits</span>
        <a href="http://localhost:5173" target="_blank" class="topup-link">Manage Ledger →</a>
      </div>
      <div class="credit-display">
        <span class="credit-number" id="userCreditAmount">25,000</span>
        <span class="credit-unit">Credits</span>
      </div>
      <div class="cost-breakdown">
        <span>Quality: 150cr</span> • <span>Fast: 75cr</span> • <span>Lite: 40cr</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btnLaunchFlow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Launch Authenticated Flow Session
      </button>

      <button class="btn btn-secondary" id="btnOpenDashboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        Open FlowVeo Dashboard
      </button>
    </div>

    <footer class="footer">
      <span>Protected Multi-Tenant Google Session</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
